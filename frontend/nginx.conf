server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The build emits unhashed filenames (main.js, styles.css, index.html), so
    # assets must always be revalidated. "no-cache" lets the browser keep a copy
    # but forces a conditional request; nginx answers 304 from ETag/Last-Modified
    # when unchanged and serves the new file after a deploy. This stops
    # already-open devices from running an outdated bundle until a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
