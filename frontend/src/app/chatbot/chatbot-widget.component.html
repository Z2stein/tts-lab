<button type="button" class="fixed bottom-4 right-4 z-10 rounded-full border-0 bg-studio-accent px-4 py-2 font-extrabold text-studio-field chat-toggle" (click)="toggle()">{{ isOpen ? 'Close chat' : 'Open chat' }}</button>

<section *ngIf="isOpen" class="fixed bottom-16 right-4 z-10 w-80 rounded-lg border border-studio-lineStrong bg-studio-panel p-3 text-studio-text shadow-2xl chatbox">
  <div class="mb-2 max-h-56 overflow-auto">
    <p *ngFor="let message of messages" [class.text-right]="message.role === 'user'" [class.text-studio-accentSoft]="message.role === 'user'" [class.text-left]="message.role === 'assistant'" [class.text-studio-text]="message.role === 'assistant'">
      <strong>{{ message.role === 'user' ? 'You' : 'Assistant' }}:</strong> {{ message.text }}
    </p>
  </div>

  <p *ngIf="loading">Thinking...</p>
  <p *ngIf="error" class="mt-2 rounded-lg border border-studio-dangerLine bg-studio-dangerBg p-2 font-extrabold text-studio-danger">{{ error }}</p>

  <div class="flex gap-2">
    <input class="min-w-0 flex-1 rounded-lg border border-studio-lineStrong bg-studio-field px-3 py-2 text-studio-text outline-none focus:border-studio-accent focus:ring-2 focus:ring-studio-accent/25" [(ngModel)]="input" placeholder="Ask something..." />
    <button type="button" class="rounded-full border-0 bg-studio-accent px-4 py-2 font-extrabold text-studio-field" (click)="send()" [disabled]="loading || !input.trim()">Send</button>
  </div>
</section>
