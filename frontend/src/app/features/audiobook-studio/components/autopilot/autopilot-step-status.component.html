<div
  class="grid grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-4 rounded-lg border p-4"
  [ngClass]="{
    'border-studio-line bg-studio-field/40': step.status === 'pending',
    'border-studio-accent/50 bg-studio-accent/10': step.status === 'running',
    'border-studio-line bg-studio-field/40 ': step.status === 'completed',
    'border-studio-dangerLine bg-studio-dangerBg/60': step.status === 'failed'
  }"
  [attr.data-testid]="'autopilot-step-' + step.id"
  [attr.data-status]="step.status"
>
  <span
    class="flex h-8 w-8 flex-none items-center justify-center rounded-full border text-sm font-black"
    [ngClass]="{
      'border-studio-lineStrong text-studio-muted': step.status === 'pending',
      'border-studio-accentSoft bg-studio-accent text-studio-field': step.status === 'running',
      'border-studio-success bg-studio-success text-studio-field': step.status === 'completed',
      'border-studio-dangerLine bg-studio-dangerLine text-studio-danger': step.status === 'failed'
    }"
    aria-hidden="true"
  >
    <ng-container [ngSwitch]="step.status">
      <ng-container *ngSwitchCase="'completed'">&#10003;</ng-container>
      <ng-container *ngSwitchCase="'failed'">&#10005;</ng-container>
      <ng-container *ngSwitchCase="'running'">&#9679;</ng-container>
      <ng-container *ngSwitchDefault>{{ position + 1 }}</ng-container>
    </ng-container>
  </span>
  <div class="min-w-0">
    <p class="m-0 font-extrabold text-studio-text">{{ step.label }}</p>
    <p class="mb-0 mt-0.5 text-sm text-studio-muted">{{ step.description }}</p>
    <p *ngIf="step.status === 'failed' && step.errorMessage" class="mb-0 mt-1.5 text-sm text-studio-danger">
      {{ step.errorMessage }}
    </p>
  </div>
  <span
    class="flex-none text-xs font-bold"
    [ngClass]="step.status === 'completed' ? 'text-studio-success' : 'text-studio-muted'"
  >
    <ng-container [ngSwitch]="step.status">
      <ng-container *ngSwitchCase="'completed'">Done</ng-container>
      <ng-container *ngSwitchCase="'running'">Working…</ng-container>
      <ng-container *ngSwitchCase="'failed'">Failed</ng-container>
      <ng-container *ngSwitchDefault>Pending</ng-container>
    </ng-container>
  </span>
</div>
