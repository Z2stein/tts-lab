<div
  class="ap-step ap-step-clickable"
  role="button"
  tabindex="0"
  [ngClass]="'is-' + step.status"
  [attr.data-testid]="'autopilot-step-' + step.id"
  [attr.data-status]="step.status"
  [attr.aria-label]="'Open ' + step.label + ' in the guided workflow'"
  (click)="onOpen()"
  (keydown.enter)="onOpen()"
  (keydown.space)="$event.preventDefault(); onOpen()"
>
  <span class="ap-badge" aria-hidden="true">
    <ng-container [ngSwitch]="step.status">
      <ng-container *ngSwitchCase="'completed'">&#10003;</ng-container>
      <ng-container *ngSwitchCase="'failed'">&#10005;</ng-container>
      <ng-container *ngSwitchCase="'running'">&#9679;</ng-container>
      <ng-container *ngSwitchDefault>{{ position + 1 }}</ng-container>
    </ng-container>
  </span>
  <span *ngIf="step.icon" class="ap-icon" aria-hidden="true">{{ step.icon }}</span>
  <div class="min-w-0">
    <p class="m-0 text-[1rem] font-bold text-studio-text">{{ step.label }}</p>
    <p class="mb-0 mt-0.5 text-[0.8rem] leading-snug text-studio-muted">{{ step.description }}</p>
    <p *ngIf="step.status === 'failed' && step.errorMessage" class="mb-0 mt-1.5 text-sm text-studio-danger">
      {{ step.errorMessage }}
    </p>
  </div>
  <span class="ap-state">
    <ng-container [ngSwitch]="step.status">
      <ng-container *ngSwitchCase="'completed'">Done</ng-container>
      <ng-container *ngSwitchCase="'running'">Working</ng-container>
      <ng-container *ngSwitchCase="'failed'">Failed</ng-container>
      <ng-container *ngSwitchDefault>Pending</ng-container>
    </ng-container>
  </span>
</div>
