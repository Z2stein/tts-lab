<div
  class="inline-flex gap-1 rounded-full border border-studio-line bg-studio-field p-1"
  role="tablist"
  aria-label="Workflow mode"
  data-testid="autopilot-mode-toggle"
>
  <button
    type="button"
    role="tab"
    class="cursor-pointer rounded-full border-0 px-5 py-2 font-extrabold"
    [ngClass]="mode === 'guided' ? 'bg-studio-accent text-studio-field ap-toggle-active' : 'bg-transparent text-studio-muted'"
    [attr.aria-selected]="mode === 'guided'"
    data-testid="studio-mode-guided"
    (click)="select('guided')"
  >
    Step-by-Step Guide
  </button>
  <button
    type="button"
    role="tab"
    class="cursor-pointer rounded-full border-0 px-5 py-2 font-extrabold"
    [ngClass]="mode === 'autopilot' ? 'bg-studio-accent text-studio-field ap-toggle-active' : 'bg-transparent text-studio-muted'"
    [attr.aria-selected]="mode === 'autopilot'"
    data-testid="studio-mode-autopilot"
    (click)="select('autopilot')"
  >
    1-Click Creation
  </button>
</div>
