<section id="autopilot-setup" class="glow-card" data-testid="autopilot-setup" aria-labelledby="autopilot-setup-title">
  <header>
    <span class="task-label">1-Click Creation mode</span>
    <h2 id="autopilot-setup-title" class="mb-2 mt-1.5 text-2xl leading-tight text-studio-text">
      We turn your story into a ready-to-listen audiobook preview.
    </h2>

  </header>

  <div role="tablist" class="mt-5 flex gap-1 border-b border-[rgba(195,204,255,0.16)]" aria-label="Story source">
    <button
      role="tab"
      type="button"
      data-testid="autopilot-tab-paste"
      class="rounded-t-lg border-b-2 px-4 py-2 text-[0.9rem] font-bold transition-colors"
      [ngClass]="activeTab() === 'paste' ? 'border-studio-accent text-studio-accent' : 'border-transparent text-studio-muted'"
      [attr.aria-selected]="activeTab() === 'paste'"
      (click)="activeTab.set('paste')"
    >
      Paste story
    </button>
    <button
      role="tab"
      type="button"
      data-testid="autopilot-tab-generate"
      class="rounded-t-lg border-b-2 px-4 py-2 text-[0.9rem] font-bold transition-colors"
      [ngClass]="activeTab() === 'generate' ? 'border-studio-accent text-studio-accent' : 'border-transparent text-studio-muted'"
      [attr.aria-selected]="activeTab() === 'generate'"
      (click)="activeTab.set('generate')"
    >
      Generate from idea ✨
    </button>
  </div>

  <ng-container *ngIf="activeTab() === 'paste'">
    <label class="mb-2 mt-4 block font-extrabold text-studio-text" for="autopilot-story-text">Your story</label>
    <textarea
      id="autopilot-story-text"
      class="form-control min-h-32 resize-y"
      rows="6"
      placeholder="Paste your story here…"
      [formControl]="storyControl"
      data-testid="autopilot-story-input"
    ></textarea>
    <div class="mt-2 flex flex-wrap gap-[0.5rem] text-[#c9d1e8]" aria-label="Story text stats">
      <span class="badge">{{ wordCount }} words</span>
      <span class="badge">{{ characterCount }} characters</span>
    </div>

    @if (showIdeaCta()) {
      <button
        type="button"
        data-testid="idea-cta"
        class="mt-3 flex w-full items-center gap-3 rounded-xl border border-[rgba(167,139,250,0.5)] bg-[rgba(167,139,250,0.08)] px-4 py-3 text-left font-bold text-[#c4b5fd] transition-colors hover:bg-[rgba(167,139,250,0.16)]"
        (click)="openIdeaTab()"
      >
        <span aria-hidden="true" class="text-lg leading-none">✨</span>
        <span class="flex-1">No story yet? Create one from a rough idea ✨</span>
        <svg aria-hidden="true" class="h-4 w-4 flex-none text-studio-muted" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    }
  </ng-container>

  <div *ngIf="activeTab() === 'generate'" class="mt-4">
    <app-story-generator
      [disabled]="running"
      (storyGenerated)="onStoryGenerated($event)"
    ></app-story-generator>
  </div>

  @if (activeTab() !== 'generate') {
    <button
      type="button"
      class="primary-button glow-cta mt-6 w-full disabled:cursor-not-allowed"
      data-testid="start-autopilot-button"
      [disabled]="!canStart"
      (click)="onStart()"
    >
      {{ running ? '1-Click Creation running…' : '▶ Start 1-Click Creation' }}
    </button>
    <p class="mb-0 mt-3 text-center text-sm text-studio-muted">Estimated time: 2–6 minutes for a standard chapter</p>
  }
</section>
