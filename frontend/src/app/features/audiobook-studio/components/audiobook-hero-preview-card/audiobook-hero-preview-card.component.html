<div
  class="relative flex flex-col rounded-3xl border border-[rgba(240,173,93,0.35)] p-4"
  style="background: rgba(10,8,22,0.85); box-shadow: 0 0 60px rgba(110,40,210,0.25), 0 0 30px rgba(240,173,93,0.2), 0 18px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);"
  data-testid="hero-preview-card"
  aria-label="Story to audiobook preview"
>
  <!-- Stage 1: Your story -->
  <article class="flex items-start gap-3.5">
    <div class="flex-none w-11 h-11 rounded-full flex items-center justify-center" style="background: rgba(110,40,210,0.25); box-shadow: 0 0 20px rgba(110,40,210,0.4)" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c965ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
        <path d="M14 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10z"/>
        <path d="M14 4v6h6"/>
        <path d="M8 13h8"/>
        <path d="M8 17h5"/>
      </svg>
    </div>
    <div class="flex-1 min-w-0">
      <h3 class="m-0 font-black text-base text-[#f8efe5]">Your story</h3>
      <p class="m-0 text-sm text-[#9aa3bc] leading-snug">&ldquo;{{ storyExcerpt }}&rdquo;</p>
    </div>
  </article>

  <!-- Connector -->
  <div class="flex justify-start pl-[1.3rem] py-1.5" aria-hidden="true">
    <span class="block w-1.5 h-1.5 rotate-45 bg-[#c965ff]" style="box-shadow: 0 0 8px rgba(201,101,255,0.8)"></span>
  </div>

  <!-- Stage 2: AI detects cast -->
  <article class="flex items-start gap-3.5">
    <div class="flex-none w-11 h-11 rounded-full flex items-center justify-center" style="background: rgba(110,40,210,0.25); box-shadow: 0 0 20px rgba(110,40,210,0.4)" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c965ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
        <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/>
        <circle cx="9.5" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    </div>
    <div class="flex-1 min-w-0 flex items-center gap-3">
      <div class="flex-none min-w-0">
        <h3 class="m-0 font-black text-base text-[#f8efe5] whitespace-nowrap">AI detects cast</h3>
        <p class="m-0 text-sm text-[#9aa3bc] leading-snug whitespace-nowrap">{{ cast.length }} characters ready</p>
      </div>
      <div class="flex-1 flex justify-end" *ngIf="cast.length" aria-hidden="true">
        <div class="flex items-center justify-between w-full max-w-[168px]">
          <span
            *ngFor="let member of cast; let i = index"
            class="flex-none w-8 h-8 rounded-full overflow-hidden flex items-center justify-center bg-[rgba(240,173,93,0.16)]"
            [style.boxShadow]="'0 0 0 2px ' + accentColor(i)"
            [style.marginLeft.px]="i > 0 ? -8 : 0"
            [style.zIndex]="i"
            [attr.title]="member.name"
          >
            <img *ngIf="member.imageUrl" [src]="member.imageUrl" [alt]="member.name" class="w-full h-full object-cover" />
            <span *ngIf="!member.imageUrl" class="font-black text-xs text-[#fff8ec]">{{ member.initials }}</span>
          </span>
        </div>
      </div>
    </div>
  </article>

  <!-- Connector -->
  <div class="flex justify-start pl-[1.3rem] py-1.5" aria-hidden="true">
    <span class="block w-1.5 h-1.5 rotate-45 bg-[#c965ff]" style="box-shadow: 0 0 8px rgba(201,101,255,0.8)"></span>
  </div>

  <!-- Stage 3: Audiobook preview -->
  <article class="flex flex-col gap-3">
    <div class="flex items-start gap-3.5">
      <div class="flex-none w-11 h-11 rounded-full flex items-center justify-center" style="background: rgba(110,40,210,0.25); box-shadow: 0 0 20px rgba(110,40,210,0.4)" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c965ff" stroke-width="2" stroke-linecap="round" class="w-5 h-5">
          <line x1="4" y1="12" x2="4" y2="16"/>
          <line x1="8" y1="7" x2="8" y2="19"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
          <line x1="16" y1="8" x2="16" y2="18"/>
          <line x1="20" y1="11" x2="20" y2="15"/>
        </svg>
      </div>
      <div class="flex-1 min-w-0">
        <h3 class="m-0 font-black text-base text-[#f8efe5]">Audiobook preview</h3>
        <p class="m-0 text-sm text-[#9aa3bc] leading-snug">Multi-speaker audio with emotion &amp; pacing</p>
      </div>
    </div>
    <div class="flex items-center gap-3 w-full rounded-2xl p-3" style="background: rgba(8,6,20,0.92); box-shadow: inset 0 0 20px rgba(110,40,210,0.15);">
      <button
        type="button"
        class="flex-none w-9 h-9 rounded-full flex items-center justify-center transition-all hover:bg-[rgba(110,40,210,0.55)]"
        style="background: rgba(110,40,210,0.35)"
        [attr.aria-label]="playing ? 'Pause audiobook preview' : 'Play audiobook preview'"
        (click)="togglePlay.emit($event)"
      >
        <span class="text-[#ffd591]" [class.play-icon]="!playing" [class.play-icon-pause]="playing" aria-hidden="true"></span>
      </button>
      <div class="flex-1 min-w-0 flex items-center justify-center gap-[2px] h-7 overflow-hidden" aria-hidden="true">
        <span
          *ngFor="let bar of waveformBars; let i = index"
          class="flex-1 rounded-full transition-all duration-150"
          [style.height.px]="bar"
          [style.backgroundColor]="barActive(i) ? '#f0ad5d' : '#c965ff'"
          [style.opacity]="barActive(i) ? 1 : 0.35"
          style="min-width: 1px;"
        ></span>
      </div>
      <span class="flex-none text-xs font-semibold text-[#9aa3bc] whitespace-nowrap">{{ duration }}</span>
    </div>
  </article>
</div>
