<div class="flex items-center gap-[0.9rem]">
  <span class="inline-flex w-[2.35rem] h-[2.35rem] items-center justify-center flex-none rounded-full bg-gradient-to-r from-[#ffe2a7] to-[#f0ad5d] shadow-[0_0_28px_rgba(240,173,93,0.25)] text-[#140f14] font-black">1</span>
  <div>
    <h2 id="story-input-title" class="mb-[0.2rem] text-[#fff8ec] font-family-georgia text-[clamp(1.4rem,3vw,2rem)] leading-[1.1]">Story input</h2>
    <p class="m-0">Start with narration and character dialogue. The AI will find the narrator and characters for you.</p>
  </div>
</div>

<label for="story-text" class="font-bold">Story text</label>
<textarea
  id="story-text"
  rows="12"
  class="form-control"
  [formControl]="storyControl"
  placeholder="Narrator: The platform lights flickered...&#10;Mara: Did you hear that?"
></textarea>

<div class="flex flex-wrap items-center gap-[0.85rem] justify-between">
  <div class="flex flex-wrap gap-[0.5rem] text-[#c9d1e8]" aria-label="Story text stats">
    <span class="badge">{{ wordCount }} words</span>
    <span class="badge">{{ characterCount }} characters</span>
  </div>
  <div class="flex flex-wrap items-center gap-[0.85rem]">
    <button type="button" class="secondary-button" (click)="useSampleStory.emit()" [disabled]="loadingAction !== null">
      Use sample story
    </button>
    <button type="button" class="primary-button" (click)="analyzeStory.emit()" [disabled]="loadingAction !== null || storyControl.value.trim().length === 0">
      {{ isLoading('cast') ? 'Finding narrator & characters...' : 'Find narrator & characters' }}
    </button>
  </div>
</div>
