<div class="step-heading">
  <span class="step-number">1</span>
  <div>
    <h2 id="story-input-title">Story input</h2>
    <p>Start with narration and character dialogue.</p>
  </div>
</div>

<label for="story-text">Story text</label>
<textarea
  id="story-text"
  rows="12"
  [formControl]="storyControl"
  placeholder="Narrator: The platform lights flickered...&#10;Mara: Did you hear that?"
></textarea>

<div class="story-tools">
  <div class="stats" aria-label="Story text stats">
    <span>{{ wordCount }} words</span>
    <span>{{ characterCount }} characters</span>
  </div>
  <div class="button-row">
    <button type="button" class="secondary-button" (click)="useSampleStory.emit()" [disabled]="loadingAction !== null">
      Use sample story
    </button>
    <button type="button" class="primary-button next-action" (click)="analyzeStory.emit()" [disabled]="loadingAction !== null || storyControl.value.trim().length === 0">
      {{ isLoading('cast') ? 'Finding narrator & characters...' : 'Find narrator & characters' }}
    </button>
  </div>
</div>
