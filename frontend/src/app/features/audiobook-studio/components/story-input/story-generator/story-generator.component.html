<div class="flex flex-col gap-[1.1rem]">
  <div class="flex flex-col gap-[0.5rem]">
    <label for="idea-input" class="font-bold">Describe your story idea</label>
    <textarea
      id="idea-input"
      data-testid="idea-input"
      rows="4"
      maxlength="1000"
      class="form-control"
      [formControl]="ideaControl"
      placeholder='Example: "A lonely lighthouse keeper discovers a voice inside the storm..."'
    ></textarea>
    <div class="text-right text-[0.8rem] text-[#c9d1e8]">{{ charCount }} / 1000 characters</div>
  </div>

  <div class="flex flex-col gap-[0.5rem]">
    <span class="font-bold">Enhance your story (optional)</span>
    <div class="flex flex-wrap gap-[0.5rem]">
      @for (chip of chips; track chip) {
        <button
          type="button"
          [attr.data-testid]="'chip-' + chip"
          class="secondary-button px-3.5 py-1.5 text-sm"
          [class.chip-lit]="isChipSelected(chip)"
          (click)="toggleChip(chip)"
        >
          + {{ chip }}
        </button>
      }
    </div>
  </div>

  @if (error()) {
    <div role="alert" class="text-[#ff7070] text-[0.9rem]">{{ error() }}</div>
  }

  @if (generating()) {
    <div class="ap-busy mt-4" role="status" aria-live="polite" data-testid="generate-idea-busy">
      <span class="ap-busy-spinner" aria-hidden="true">
        <span class="ap-busy-ring"></span>
        <svg class="ap-busy-robot" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <line x1="24" y1="4" x2="24" y2="11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="24" cy="3" r="2.5" fill="currentColor"/>
          <rect x="8" y="11" width="32" height="26" rx="5" stroke="currentColor" stroke-width="2.5" fill="none"/>
          <rect x="13" y="18" width="7" height="6" rx="1.5" fill="currentColor"/>
          <rect x="28" y="18" width="7" height="6" rx="1.5" fill="currentColor"/>
          <path d="M16 31 Q24 37 32 31" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="3" y="20" width="5" height="8" rx="1.5" fill="currentColor"/>
          <rect x="40" y="20" width="5" height="8" rx="1.5" fill="currentColor"/>
        </svg>
      </span>
      <span class="ap-busy-label">Creating story draft...</span>
    </div>
  } @else {
    <button
      type="button"
      data-testid="create-story-draft"
      class="primary-button"
      [disabled]="!canGenerate || disabled"
      (click)="generateStory()"
    >
      Create story draft
    </button>
  }
</div>
