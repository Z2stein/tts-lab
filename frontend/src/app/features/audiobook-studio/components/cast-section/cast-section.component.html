<button type="button" class="flex items-center gap-[0.9rem] w-full text-left bg-transparent border-0 p-0 cursor-pointer" (click)="toggleCollapsed()" [attr.aria-expanded]="!collapsed()">
  <span class="step-number" [class.step-number-done]="isCompleted">2</span>
  <div class="flex-1">
    <h2 id="discover-cast-title" class="m-0 mb-[0.2rem] text-[#fff8ec] font-family-georgia text-[clamp(1.4rem,3vw,2rem)] leading-[1.1]">Choose voices</h2>
    <p class="m-0 text-[#c9d1e8] leading-[1.6]">We found the speakers in your story. Preview each voice or change it.</p>
  </div>
  <span class="text-[#c9d1e8] text-[1.2rem] flex-none ml-2" aria-hidden="true">{{ collapsed() ? '▸' : '▾' }}</span>
</button>

<ng-container *ngIf="!collapsed()">

<p *ngIf="cast.length > 0 && !castReviewed" class="rounded-[0.8rem] border border-[rgba(240,173,93,0.5)] bg-[rgba(240,173,93,0.1)] text-[#ffd591] text-[0.92rem] font-[900] p-[0.7rem_0.85rem]">Please review and approve the voices</p>
<p *ngIf="cast.length === 0" class="m-0 text-[#c9d1e8] leading-[1.6]">Speakers will appear after story analysis.</p>
<div *ngIf="cast.length > 0" class="grid gap-[0.3rem] grid-cols-1" aria-label="Cast">
  <app-cast-card
    class="cast-card cast-card-container"
    *ngFor="let speaker of cast; let i = index; trackBy: trackCastByIndex"
    [speaker]="speaker"
    [index]="i"
    [accentClass]="accentClass(i)"
    [editing]="editingCastIndex === i"
    [editDraft]="editingCastIndex === i ? castEditDraft : null"
    [castEditable]="castEditable"
    [isOnlySpeaker]="cast.length === 1"
    [speakerStyleFn]="speakerStyleFn"
    (startEdit)="startCastEdit.emit(i)"
    (saveEdit)="saveCastEdit.emit(i)"
    (cancelEdit)="cancelCastEdit.emit()"
    (changeVoice)="changeVoice.emit(i)"
    (removeSpeaker)="removeSpeaker.emit(i)"
  ></app-cast-card>
</div>

<app-add-speaker-form
  *ngIf="cast.length > 0 && castEditable && addingSpeaker && addSpeakerDraft"
  [draft]="addSpeakerDraft"
  (save)="saveAddSpeaker.emit()"
  (cancel)="cancelAddSpeaker.emit()"
  (pickVoice)="pickVoiceForNewSpeaker.emit()"
></app-add-speaker-form>

<button
  *ngIf="cast.length > 0 && castEditable && !addingSpeaker"
  type="button"
  class="flex items-center justify-center gap-[0.5rem] w-full border border-dashed border-[rgba(195,204,255,0.28)] rounded-2xl bg-transparent text-[#c9d1e8] cursor-pointer text-[0.95rem] font-[900] p-[0.85rem] transition-[border-color,color] duration-150 hover:border-[rgba(240,173,93,0.55)] hover:text-[#ffd591]"
  data-testid="add-speaker"
  (click)="startAddSpeaker.emit()"
>
  <span aria-hidden="true" class="text-[1.2rem] leading-none">+</span> Add speaker
</button>

<p *ngIf="cast.length > 0 && !castEditable" class="m-0 text-[#c9d1e8] leading-[1.6]">Cast edits are locked after script preview begins.</p>

<app-ai-hint-panel
  [control]="speakerSplitHintControl"
  placeholder="e.g. remove all narrator parts"
></app-ai-hint-panel>

<button type="button" class="primary-button" (click)="createScriptPreview.emit()" [disabled]="loadingAction !== null || cast.length === 0">
  {{ isLoading('script') ? 'Creating script preview...' : 'Find Speech Segments' }}
</button>

</ng-container>
