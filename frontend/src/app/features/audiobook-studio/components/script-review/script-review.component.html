<div class="step-heading">
  <span class="step-number">3</span>
  <div>
    <h2 id="script-preview-title">Review script</h2>
    <p>Check that each line is assigned to the correct speaker.</p>
  </div>
</div>

<p *ngIf="scriptTurns.length > 0 && !scriptApproved" class="review-status">Script needs your approval</p>
<p *ngIf="scriptTurns.length === 0" class="empty-state">Script will appear after voices are chosen.</p>
<div *ngIf="scriptTurns.length > 0" class="script-panel">
  <article *ngFor="let group of scriptGroups; trackBy: trackScriptGroup" class="script-group" [ngStyle]="speakerStyleFn(group.speaker)">
    <h3>{{ displayName(group.speaker) }}</h3>
    <app-script-turn
      *ngFor="let indexedTurn of group.turns; trackBy: trackScriptTurn"
      [indexedTurn]="indexedTurn"
      [editing]="editingScriptTurnIndex === indexedTurn.index"
      [editDraft]="editingScriptTurnIndex === indexedTurn.index ? scriptTurnEditDraft : null"
      [speakerOptions]="speakerOptions"
      (startEdit)="startTurnEdit.emit(indexedTurn.index)"
      (saveEdit)="saveTurnEdit.emit(indexedTurn.index)"
      (cancelEdit)="cancelTurnEdit.emit()"
    ></app-script-turn>
  </article>
</div>

<button type="button" class="primary-button next-action" (click)="approveScript.emit()" [disabled]="loadingAction !== null || scriptTurns.length === 0 || scriptApproved">
  Approve script & continue
</button>
<button type="button" class="secondary-button" (click)="addEmotionAndPacing.emit()" [disabled]="loadingAction !== null || scriptTurns.length === 0 || !scriptApproved">
  {{ isLoading('notes') ? 'Adding emotion & pacing...' : 'Add emotion & pacing' }}
</button>
