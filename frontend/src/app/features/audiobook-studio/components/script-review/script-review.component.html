<div class="flex items-center gap-[0.9rem]">
  <span class="inline-flex w-[2.35rem] h-[2.35rem] items-center justify-center flex-none rounded-full bg-gradient-to-r from-[#ffe2a7] to-[#f0ad5d] shadow-[0_0_28px_rgba(240,173,93,0.25)] text-[#140f14] font-black">3</span>
  <div>
    <h2 id="script-preview-title" class="m-0 mb-[0.2rem] text-[#fff8ec] font-family-georgia text-[clamp(1.4rem,3vw,2rem)] leading-[1.1]">Review script</h2>
    <p class="m-0 text-[#c9d1e8] leading-[1.6]">Check that each line is assigned to the correct speaker.</p>
  </div>
</div>

<p *ngIf="scriptTurns.length > 0 && !scriptApproved" class="rounded-[0.8rem] border border-[rgba(240,173,93,0.5)] bg-[rgba(240,173,93,0.1)] text-[#ffd591] text-[0.92rem] font-[900] p-[0.7rem_0.85rem]">Script needs your approval</p>
<p *ngIf="scriptTurns.length === 0" class="m-0 text-[#c9d1e8] leading-[1.6]">Script will appear after voices are chosen.</p>
<div *ngIf="scriptTurns.length > 0" class="grid gap-[0.85rem]">
  <article *ngFor="let group of scriptGroups; trackBy: trackScriptGroup" class="border-l-4 pl-[0.9rem]" [style.borderLeftColor]="'var(--speaker-accent, #f0ad5d)'" [ngStyle]="speakerStyleFn(group.speaker)">
    <h3 class="m-0 mb-[0.35rem]" [style.color]="'color-mix(in srgb, var(--speaker-accent, #f0ad5d) 74%, #fff8ec)'">{{ displayName(group.speaker) }}</h3>
    <app-script-turn
      *ngFor="let indexedTurn of group.turns; trackBy: trackScriptTurn"
      [indexedTurn]="indexedTurn"
      [editing]="editingScriptTurnIndex === indexedTurn.index"
      [editDraft]="editingScriptTurnIndex === indexedTurn.index ? scriptTurnEditDraft : null"
      [speakerOptions]="speakerOptions"
      [loadingAction]="loadingAction"
      (startEdit)="startTurnEdit.emit(indexedTurn.index)"
      (saveEdit)="saveTurnEdit.emit(indexedTurn.index)"
      (cancelEdit)="cancelTurnEdit.emit()"
    ></app-script-turn>
  </article>
</div>

<details class="border border-[rgba(195,204,255,0.16)] rounded-2xl bg-[rgba(5,9,20,0.5)] p-4">
  <summary class="text-[#ffd591] cursor-pointer font-[900]">Custom AI instruction (optional)</summary>
  <div class="mt-4">
    <label for="emotion-annotation-hint" class="block font-[900] mb-2">Instruction</label>
    <textarea
      id="emotion-annotation-hint"
      rows="2"
      class="box-border w-full border border-[rgba(195,204,255,0.18)] rounded-[0.8rem] bg-[rgba(5,9,20,0.74)] text-[#f8efe5] outline-none p-[0.85rem_1rem] focus:border-[#f0ad5d] focus:shadow-[0_0_0_3px_rgba(240,173,93,0.22)] resize-none"
      placeholder="e.g. use only calm and serious tags"
      [formControl]="emotionAnnotationHintControl"
    ></textarea>
  </div>
</details>

<button type="button" class="primary-button" (click)="approveScript.emit()" [disabled]="loadingAction !== null || scriptTurns.length === 0 || scriptApproved">
  Approve script & continue
</button>
