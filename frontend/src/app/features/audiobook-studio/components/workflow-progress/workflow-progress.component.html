<div #sentinel class="sticky-sentinel" aria-hidden="true"></div>
<nav class="workflow-progress-shell" aria-label="Audiobook workflow progress" data-testid="workflow-progress">
  <div class="workflow-progress-panel">
    <div class="workflow-progress" [class.compact]="isSticky && isNarrow">
      <button
        *ngFor="let step of visibleSteps"
        type="button"
        class="workflow-step"
        data-testid="workflow-step"
        [class.completed]="step.status === 'completed'"
        [class.current]="step.status === 'current'"
        [class.warning-state]="step.status === 'warning'"
        [class.locked]="step.status === 'locked'"
        [disabled]="step.status === 'locked'"
        (click)="onStepClick(step.sectionId, $event)"
      >
        <span class="workflow-marker" aria-hidden="true"></span>
        <span>
          <strong>{{ step.label }}</strong>
          <small>{{ step.statusLabel }}</small>
        </span>
      </button>
    </div>
  </div>
</nav>
