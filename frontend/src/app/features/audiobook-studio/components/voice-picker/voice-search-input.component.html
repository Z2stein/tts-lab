<div class="relative">
  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-studio-muted pointer-events-none" aria-hidden="true">⌕</span>
  <input
    type="search"
    class="w-full rounded-lg bg-studio-field border border-studio-line text-studio-text placeholder-studio-muted pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-studio-lineStrong"
    placeholder="Search voices..."
    [ngModel]="value"
    (ngModelChange)="valueChange.emit($event)"
    aria-label="Search voices"
    data-testid="voice-search-input"
  />
</div>
