<section class="page-card">
  <p class="eyebrow">Text Length</p>
  <h1>Text Length</h1>
  <p class="intro">Enter text and let the Spring Boot backend count its characters.</p>

  <form class="text-length-form">
    <label for="text">Text eingeben</label>
    <textarea id="text" rows="5" [formControl]="textControl"></textarea>
    <button type="button" (click)="submit()">Submit</button>
  </form>

  <p *ngIf="length !== null" class="result">Länge: {{ length }}</p>
  <p *ngIf="error" class="error">{{ error }}</p>
</section>
