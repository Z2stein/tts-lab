<section class="feature-page" aria-labelledby="text-length-title">
  <div class="page-heading">
    <p class="eyebrow">Existing backend feature</p>
    <h1 id="text-length-title">Text Length</h1>
    <p>Type any text and submit it to <code>POST /api/projects/text-length/calculate</code>.</p>
  </div>

  <form class="text-length-form">
    <label for="text">Text</label>
    <textarea id="text" rows="5" [formControl]="textControl" placeholder="Enter text to measure"></textarea>
    <button type="button" (click)="submit()">Check length</button>
  </form>

  <p *ngIf="length !== null" class="result">Length: {{ length }}</p>
  <p *ngIf="error" class="error">{{ error }}</p>
</section>
