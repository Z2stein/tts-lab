<div class="app-shell">
  <header class="top-nav">
    <a class="brand" routerLink="/">tts-lab</a>

    <nav aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/text-length" routerLinkActive="active">Text Length</a>
      <a routerLink="/tts-workbench" routerLinkActive="active">TTS Workbench</a>
    </nav>

    <div class="auth-area">
      <span *ngIf="authStatus === 'loading'">Loading...</span>
      <ng-container *ngIf="authStatus === 'authenticated' && currentUser">
        <span class="user-label">{{ currentUser.name }} ({{ currentUser.authMode }})</span>
        <button type="button" (click)="logout()">Logout</button>
      </ng-container>
      <button *ngIf="authStatus === 'unauthenticated'" type="button" (click)="loginWithGoogle()">
        Sign in with Google
      </button>
    </div>
  </header>

  <main class="content">
    <ng-container *ngIf="authStatus === 'loading'">
      <section class="page-card">
        <p>Loading...</p>
      </section>
    </ng-container>

    <ng-container *ngIf="authStatus === 'unauthenticated'">
      <section class="page-card">
        <h1>Please sign in</h1>
        <p *ngIf="authError" class="error">{{ authError }}</p>
        <p>Please sign in to use the app.</p>
        <button type="button" (click)="loginWithGoogle()">Sign in with Google</button>
      </section>
    </ng-container>

    <router-outlet *ngIf="authStatus === 'authenticated'"></router-outlet>
  </main>

  <app-chatbot-widget *ngIf="authStatus === 'authenticated'"></app-chatbot-widget>
</div>
