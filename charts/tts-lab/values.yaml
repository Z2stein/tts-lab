nameOverride: ""
fullnameOverride: ""

# Namespace-lokales Pull Secret für GHCR.
imagePullSecrets:
  - name: ghcr-pull-secret

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/<owner>/<app-slug>-frontend
    tag: latest
    pullPolicy: IfNotPresent
  livenessProbe:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  resources: {}
  service:
    type: ClusterIP
    port: 80

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/<owner>/<app-slug>-backend
    tag: latest
    pullPolicy: IfNotPresent
  livenessProbe:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  resources: {}
  service:
    type: ClusterIP
    port: 8080
    createAlias: true
    aliasName: backend

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    database: ttslab
    username: ttslab
    password: ttslab-local-password
    existingSecretName: ""
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: ""
  resources: {}

ingress:
  enabled: true
  className: traefik
  host: <app-slug>.<base-domain>
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    # secretName kann im Deployment per --set überschrieben werden
    secretName: <app-slug>-tls

app:
  environment: feature
  branchSlug: ""
  baseUrl: http://localhost
  slug: tts-lab

audiobooks:
  storage:
    root: /data/audiobooks
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: ""

auth:
  mode: mock
  googleSecretName: ""
  mockUser:
    id: mock-user-1
    email: mock.user@example.com
    name: Mock User
    roles: USER

chat:
  geminiSecretName: gemini-api
  geminiModel: gemini-2.5-flash
  provider: mock
  realProviderOnFeatureBranches: false

ttsWorkbench:
  googleCredentialsSecretName: ""
  googleCredentialsChecksum: ""

chatbot:
  rateLimit:
    enabled: true
    window: 1h
    maxRequests: 5
    idHeader: X-User-Id
