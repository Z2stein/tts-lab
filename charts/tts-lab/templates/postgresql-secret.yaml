{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tts-lab.postgresqlSecretName" . }}
  labels:
    {{- include "tts-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
  database: {{ .Values.postgresql.auth.database | quote }}
{{- end }}
