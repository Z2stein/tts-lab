apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tts-lab.fullname" . }}-backend
  labels:
    {{- include "tts-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        tts-lab/chat-provider: {{ .Values.chat.provider | quote }}
        tts-lab/google-tts-credentials-checksum: {{ .Values.ttsWorkbench.googleCredentialsChecksum | quote }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ include "tts-lab.postgresqlHost" . | quote }}
            - name: PGPORT
              value: {{ .Values.postgresql.service.port | quote }}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "tts-lab.postgresqlSecretName" . }}
                  key: database
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tts-lab.postgresqlSecretName" . }}
                  key: username
          command:
            - sh
            - -c
            - until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
          env:
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.app.environment | quote }}
            - name: BRANCH_SLUG
              value: {{ default .Values.app.environment .Values.app.branchSlug | quote }}
            - name: APP_SLUG
              value: {{ .Values.app.slug | quote }}
            - name: AUDIOBOOK_STORAGE_ROOT
              value: {{ .Values.audiobooks.storage.root | quote }}
            - name: APP_BASE_URL
              value: {{ .Values.app.baseUrl | quote }}
            - name: CHATBOT_PROVIDER
              value: {{ .Values.chat.provider | quote }}
            - name: CHAT_LIMIT_ENABLED
              value: {{ .Values.chatbot.rateLimit.enabled | quote }}
            - name: CHAT_LIMIT_WINDOW
              value: {{ .Values.chatbot.rateLimit.window | quote }}
            - name: CHAT_LIMIT_MAX_REQUESTS
              value: {{ .Values.chatbot.rateLimit.maxRequests | quote }}
            - name: CHAT_LIMIT_ID_HEADER
              value: {{ .Values.chatbot.rateLimit.idHeader | quote }}
            - name: SPRING_AI_MODEL_CHAT
              value: "google-genai"
            - name: SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL
              value: {{ .Values.chat.geminiModel | quote }}
            {{- if .Values.postgresql.enabled }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ include "tts-lab.postgresqlHost" . }}:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "tts-lab.postgresqlSecretName" . }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tts-lab.postgresqlSecretName" . }}
                  key: password
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"
            {{- end }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chat.geminiSecretName }}
                  key: api-key
                  optional: true
            {{- if .Values.ttsWorkbench.googleCredentialsSecretName }}
            - name: TTS_GOOGLE_SERVICE_ACCOUNT_JSON_B64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ttsWorkbench.googleCredentialsSecretName }}
                  key: service-account-json-b64
                  optional: true
            {{- end }}
            {{- if eq .Values.auth.mode "google" }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.googleSecretName }}
                  key: client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.googleSecretName }}
                  key: client-secret
            {{- else }}
            - name: MOCK_USER_ID
              value: {{ .Values.auth.mockUser.id | quote }}
            - name: MOCK_USER_EMAIL
              value: {{ .Values.auth.mockUser.email | quote }}
            - name: MOCK_USER_NAME
              value: {{ .Values.auth.mockUser.name | quote }}
            - name: MOCK_USER_ROLES
              value: {{ .Values.auth.mockUser.roles | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: audiobook-storage
              mountPath: {{ .Values.audiobooks.storage.root | quote }}
      volumes:
        - name: audiobook-storage
          {{- if .Values.audiobooks.storage.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "tts-lab.fullname" . }}-audiobooks
          {{- else }}
          emptyDir: {}
          {{- end }}
