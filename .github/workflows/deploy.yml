name: Build and Deploy to k3s via Helm

on:
  push:
    branches:
      - '**'
  delete:
    branches:
      - '**'
  pull_request:
    types:
      - closed

permissions:
  contents: read
  packages: write

jobs:
  prepare-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.vars.outputs.namespace }}
      release_name: ${{ steps.vars.outputs.release_name }}
      host: ${{ steps.vars.outputs.host }}
      deploy_type: ${{ steps.vars.outputs.deploy_type }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      branch_alias_tag: ${{ steps.vars.outputs.branch_alias_tag }}
      owner: ${{ steps.registry.outputs.owner }}
      app_slug: ${{ steps.repo_config.outputs.app_slug }}
      backend_image_name: ${{ steps.repo_config.outputs.backend_image_name }}
      frontend_image_name: ${{ steps.repo_config.outputs.frontend_image_name }}
      chat_provider: ${{ steps.effective_provider.outputs.chat_provider }}
    steps:
      - name: Validate required env and secrets
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ vars.GHCR_USER }}
          APP_SLUG: ${{ vars.APP_SLUG }}
          HETZNER_PUBLIC_IP: ${{ vars.HETZNER_PUBLIC_IP }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          set -euo pipefail
          [ -n "${GHCR_TOKEN}" ] || { echo "::error title=Missing GHCR_TOKEN::Set repository secret GHCR_TOKEN with a long-lived token."; exit 1; }
          [ -n "${GHCR_USER}" ] || { echo "::error title=Missing GHCR_USER::Set repository variable GHCR_USER for registry authentication."; exit 1; }
          [ -n "${APP_SLUG}" ] || { echo "::error title=Missing APP_SLUG::Set repository variable APP_SLUG for app, release, image, and hostname derivation."; exit 1; }
          [ -n "${HETZNER_PUBLIC_IP}" ] || { echo "::error title=Missing HETZNER_PUBLIC_IP::Set repository variable HETZNER_PUBLIC_IP for the deployment server public IP."; exit 1; }
          [ -n "${BASE_DOMAIN}" ] || { echo "::error title=Missing BASE_DOMAIN::Set repository variable BASE_DOMAIN for public ingress hostnames."; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute shared repo config
        id: repo_config
        env:
          APP_SLUG: ${{ vars.APP_SLUG }}
        run: |
          set -euo pipefail
          shared/deployment/repo_config.sh "$APP_SLUG" >> "$GITHUB_OUTPUT"

      - name: Compute deployment variables
        id: vars
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          HETZNER_PUBLIC_IP: ${{ vars.HETZNER_PUBLIC_IP }}
          GIT_SHA: ${{ github.sha }}
          APP_SLUG: ${{ steps.repo_config.outputs.app_slug }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          set -euo pipefail
          HETZNER_PUBLIC_IP="${HETZNER_PUBLIC_IP:-${{ vars.HETZNER_PUBLIC_IP }}}"
          scripts/deployment_vars.sh deploy "$BRANCH_NAME" "$HETZNER_PUBLIC_IP" "$GIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Compute effective chat provider
        id: effective_provider
        env:
          DEPLOY_TYPE: ${{ steps.vars.outputs.deploy_type }}
          CHAT_REAL_PROVIDER_ON_FEATURE_BRANCHES: ${{ vars.CHAT_REAL_PROVIDER_ON_FEATURE_BRANCHES }}
        run: |
          set -euo pipefail
          REAL_PROVIDER_ON_FEATURE_BRANCHES="${CHAT_REAL_PROVIDER_ON_FEATURE_BRANCHES:-false}"
          if [ "$DEPLOY_TYPE" = "main" ] || [ "$DEPLOY_TYPE" = "develop" ] || [ "$REAL_PROVIDER_ON_FEATURE_BRANCHES" = "true" ]; then
            echo "chat_provider=gemini" >> "$GITHUB_OUTPUT"
          else
            echo "chat_provider=mock" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute registry owner
        id: registry
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build-backend:
    if: github.event_name == 'push'
    needs: prepare-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.prepare-build.outputs.owner }}/${{ needs.prepare-build.outputs.backend_image_name }}:${{ needs.prepare-build.outputs.image_tag }}
            ghcr.io/${{ needs.prepare-build.outputs.owner }}/${{ needs.prepare-build.outputs.backend_image_name }}:${{ needs.prepare-build.outputs.branch_alias_tag }}

      - name: Verify pushed backend image is pullable
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/${{ needs.prepare-build.outputs.owner }}/${{ needs.prepare-build.outputs.backend_image_name }}:${{ needs.prepare-build.outputs.image_tag }}" >/dev/null

  build-frontend:
    if: github.event_name == 'push'
    needs: prepare-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.prepare-build.outputs.owner }}/${{ needs.prepare-build.outputs.frontend_image_name }}:${{ needs.prepare-build.outputs.image_tag }}
            ghcr.io/${{ needs.prepare-build.outputs.owner }}/${{ needs.prepare-build.outputs.frontend_image_name }}:${{ needs.prepare-build.outputs.branch_alias_tag }}

      - name: Verify pushed frontend image is pullable
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/${{ needs.prepare-build.outputs.owner }}/${{ needs.prepare-build.outputs.frontend_image_name }}:${{ needs.prepare-build.outputs.image_tag }}" >/dev/null

  deploy:
    if: github.event_name == 'push'
    needs: [prepare-build, build-backend, build-frontend]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Validate required env and secrets
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ vars.GHCR_USER }}
          APP_SLUG: ${{ needs.prepare-build.outputs.app_slug }}
          HETZNER_PUBLIC_IP: ${{ vars.HETZNER_PUBLIC_IP }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.TTS_GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          CHAT_PROVIDER: ${{ needs.prepare-build.outputs.chat_provider }}
          DEPLOY_TYPE: ${{ needs.prepare-build.outputs.deploy_type }}
        run: |
          set -euo pipefail
          [ -n "${GHCR_TOKEN}" ] || { echo "::error title=Missing GHCR_TOKEN::Set repository secret GHCR_TOKEN with a long-lived token."; exit 1; }
          [ -n "${GHCR_USER}" ] || { echo "::error title=Missing GHCR_USER::Set repository variable GHCR_USER for registry authentication."; exit 1; }
          [ -n "${APP_SLUG}" ] || { echo "::error title=Missing APP_SLUG::Set repository variable APP_SLUG for app, release, image, and hostname derivation."; exit 1; }
          [ -n "${HETZNER_PUBLIC_IP}" ] || { echo "::error title=Missing HETZNER_PUBLIC_IP::Set repository variable HETZNER_PUBLIC_IP for the deployment server public IP."; exit 1; }
          [ -n "${BASE_DOMAIN}" ] || { echo "::error title=Missing BASE_DOMAIN::Set repository variable BASE_DOMAIN for public ingress hostnames."; exit 1; }
          [ -n "${HETZNER_USER}" ] || { echo "::error title=Missing HETZNER_USER::Set repository secret HETZNER_USER for SSH deploy user."; exit 1; }
          [ -n "${HETZNER_SSH_KEY}" ] || { echo "::error title=Missing HETZNER_SSH_KEY::Set repository secret HETZNER_SSH_KEY for SSH authentication."; exit 1; }
          if [ "${CHAT_PROVIDER}" = "gemini" ]; then
            [ -n "${GEMINI_API_KEY}" ] || { echo "::error title=Missing GEMINI_API_KEY::Set repository secret GEMINI_API_KEY for chatbot backend runtime."; exit 1; }
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ vars.HETZNER_PUBLIC_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy via Helm on k3s
        env:
          HOST: ${{ vars.HETZNER_PUBLIC_IP }}
          USER: ${{ secrets.HETZNER_USER }}
          NAMESPACE: ${{ needs.prepare-build.outputs.namespace }}
          RELEASE_NAME: ${{ needs.prepare-build.outputs.release_name }}
          APP_HOST: ${{ needs.prepare-build.outputs.host }}
          IMAGE_TAG: ${{ needs.prepare-build.outputs.image_tag }}
          GHCR_USERNAME: ${{ vars.GHCR_USER }}
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN }}
          GHCR_OWNER: ${{ needs.prepare-build.outputs.owner }}
          BACKEND_IMAGE_NAME: ${{ needs.prepare-build.outputs.backend_image_name }}
          DEPLOY_TYPE: ${{ needs.prepare-build.outputs.deploy_type }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FRONTEND_IMAGE_NAME: ${{ needs.prepare-build.outputs.frontend_image_name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.TTS_GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          CHAT_PROVIDER: ${{ needs.prepare-build.outputs.chat_provider }}
          CHAT_REAL_PROVIDER_ON_FEATURE_BRANCHES: ${{ vars.CHAT_REAL_PROVIDER_ON_FEATURE_BRANCHES }}
          APP_SLUG: ${{ needs.prepare-build.outputs.app_slug }}
        run: |
          set -euo pipefail
          REMOTE_APP_DIR="/opt/${APP_SLUG}"
          ssh "$USER@$HOST" "mkdir -p '$REMOTE_APP_DIR/charts'"
          scp -r charts/tts-lab "$USER@$HOST:$REMOTE_APP_DIR/charts/"

          ssh "$USER@$HOST" bash -s -- "$NAMESPACE" "$RELEASE_NAME" "$APP_HOST" "$IMAGE_TAG" "$GHCR_USERNAME" "$GHCR_PASSWORD" "$GHCR_OWNER" "$FRONTEND_IMAGE_NAME" "$BACKEND_IMAGE_NAME" "$DEPLOY_TYPE" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" "$GEMINI_API_KEY" "$CHAT_PROVIDER" "$REMOTE_APP_DIR" "$TTS_GOOGLE_SERVICE_ACCOUNT_JSON_B64" <<'EOF'
            set -euo pipefail
            NAMESPACE="$1"
            RELEASE_NAME="$2"
            APP_HOST="$3"
            IMAGE_TAG="$4"
            GHCR_USERNAME="$5"
            GHCR_PASSWORD="$6"
            GHCR_OWNER="$7"
            FRONTEND_IMAGE_NAME="$8"
            BACKEND_IMAGE_NAME="$9"
            DEPLOY_TYPE="${10}"
            GOOGLE_CLIENT_ID="${11}"
            GOOGLE_CLIENT_SECRET="${12}"
            GEMINI_API_KEY="${13}"
            CHAT_PROVIDER="${14}"
            REMOTE_APP_DIR="${15}"
            TTS_GOOGLE_SERVICE_ACCOUNT_JSON_B64="${16}"

            if [ "$DEPLOY_TYPE" = "main" ] || [ "$DEPLOY_TYPE" = "develop" ]; then
              AUTH_MODE="google"
              AUTH_GOOGLE_SECRET_NAME="google-oauth"
              ENVIRONMENT=$([ "$DEPLOY_TYPE" = "main" ] && echo "main" || echo "dev")
              VALUES_FILE=$([ "$DEPLOY_TYPE" = "main" ] && echo "values-main.yaml" || echo "values-develop.yaml")
            else
              AUTH_MODE="mock"
              AUTH_GOOGLE_SECRET_NAME=""
              ENVIRONMENT="feature"
              VALUES_FILE="values-feature.yaml"
            fi
            POSTGRES_PASSWORD=$(printf '%s:%s:postgresql' "$NAMESPACE" "$RELEASE_NAME" | sha256sum | awk '{print $1}')

            kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

            if [ "$AUTH_MODE" = "google" ]; then
              kubectl -n "$NAMESPACE" create secret generic google-oauth \
                --from-literal=client-id="$GOOGLE_CLIENT_ID" \
                --from-literal=client-secret="$GOOGLE_CLIENT_SECRET" \
                --dry-run=client -o yaml | kubectl apply -f -
            fi

            kubectl -n "$NAMESPACE" create secret generic gemini-api \
              --from-literal=api-key="${GEMINI_API_KEY:-}" \
              --dry-run=client -o yaml | kubectl apply -f -

            TTS_GOOGLE_CREDENTIALS_CHECKSUM=""
            TTS_GOOGLE_CREDENTIALS_SECRET_NAME=""
            if [ -n "${TTS_GOOGLE_SERVICE_ACCOUNT_JSON_B64:-}" ]; then
              TTS_GOOGLE_CREDENTIALS_SECRET_NAME="google-tts-service-account"
              TTS_GOOGLE_CREDENTIALS_CHECKSUM=$(printf %s "$TTS_GOOGLE_SERVICE_ACCOUNT_JSON_B64" | sha256sum | awk '{print $1}')
              kubectl -n "$NAMESPACE" create secret generic google-tts-service-account \
                --from-literal=service-account-json-b64="$TTS_GOOGLE_SERVICE_ACCOUNT_JSON_B64" \
                --dry-run=client -o yaml | kubectl apply -f -
            fi

            kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull-secret \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_USERNAME" \
              --docker-password="$GHCR_PASSWORD" \
              --dry-run=client -o yaml | kubectl apply -f -

            helm upgrade --install "$RELEASE_NAME" "$REMOTE_APP_DIR/charts/tts-lab" \
              --namespace "$NAMESPACE" \
              --values "$REMOTE_APP_DIR/charts/tts-lab/$VALUES_FILE" \
              --wait \
              --timeout 5m \
              --set ingress.host="$APP_HOST" \
              --set ingress.tls.enabled=true \
              --set ingress.tls.secretName="$RELEASE_NAME-tls" \
              --set frontend.image.repository=ghcr.io/$GHCR_OWNER/$FRONTEND_IMAGE_NAME \
              --set frontend.image.tag="$IMAGE_TAG" \
              --set backend.image.repository=ghcr.io/$GHCR_OWNER/$BACKEND_IMAGE_NAME \
              --set backend.image.tag="$IMAGE_TAG" \
              --set imagePullSecrets[0].name=ghcr-pull-secret \
              --set app.environment="$ENVIRONMENT" \
              --set app.baseUrl="https://$APP_HOST" \
              --set auth.mode="$AUTH_MODE" \
              --set auth.googleSecretName="$AUTH_GOOGLE_SECRET_NAME" \
              --set-string postgresql.auth.password="$POSTGRES_PASSWORD" \
              --set chat.geminiSecretName="gemini-api" \
              --set chat.provider="$CHAT_PROVIDER" \
              --set audiobookWorkflow.googleCredentialsSecretName="$TTS_GOOGLE_CREDENTIALS_SECRET_NAME" \
              --set audiobookWorkflow.googleCredentialsChecksum="$TTS_GOOGLE_CREDENTIALS_CHECKSUM" \
              --set chat.realProviderOnFeatureBranches="$([ "$CHAT_PROVIDER" = "gemini" ] && echo true || echo false)"

            BACKEND_DEPLOYMENT="$RELEASE_NAME-tts-lab-backend"
            FRONTEND_DEPLOYMENT="$RELEASE_NAME-tts-lab-frontend"
            BACKEND_SELECTOR="app.kubernetes.io/instance=$RELEASE_NAME,app.kubernetes.io/component=backend"
            FRONTEND_SELECTOR="app.kubernetes.io/instance=$RELEASE_NAME,app.kubernetes.io/component=frontend"

            echo "Waiting for backend rollout: deployment/$BACKEND_DEPLOYMENT"
            kubectl -n "$NAMESPACE" rollout status "deployment/$BACKEND_DEPLOYMENT" --timeout=5m
            echo "Waiting for frontend rollout: deployment/$FRONTEND_DEPLOYMENT"
            kubectl -n "$NAMESPACE" rollout status "deployment/$FRONTEND_DEPLOYMENT" --timeout=5m

            echo "Waiting for backend pods to be Ready with selector: $BACKEND_SELECTOR"
            kubectl -n "$NAMESPACE" wait --for=condition=Ready pod -l "$BACKEND_SELECTOR" --timeout=5m
            echo "Waiting for frontend pods to be Ready with selector: $FRONTEND_SELECTOR"
            kubectl -n "$NAMESPACE" wait --for=condition=Ready pod -l "$FRONTEND_SELECTOR" --timeout=5m

            kubectl -n "$NAMESPACE" get deployments,pods -l "app.kubernetes.io/instance=$RELEASE_NAME" -o wide
          EOF

      - name: Publish deployment URL
        run: |
          {
            echo "### Deployment Summary"
            echo ""
            echo "**URL:** [https://${{ needs.prepare-build.outputs.host }}](https://${{ needs.prepare-build.outputs.host }})"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Deployment URL::https://${{ needs.prepare-build.outputs.host }}"

  e2e-local:
    if: github.event_name == 'push'
    needs: [prepare-build, build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for mandatory E2E tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java for mandatory E2E tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle for mandatory E2E tests
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Locate Chrome for frontend unit tests
        id: chrome
        run: |
          set -euo pipefail
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              echo "chrome_bin=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error title=Chrome binary not found::No Chrome-compatible binary is available on the runner."
          exit 1

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          cd frontend
          npm ci

      - name: Verify frontend contract types against OpenAPI
        run: |
          set -euo pipefail
          cd frontend
          npm run verify:api-contract

      - name: Lint frontend code
        run: |
          set -euo pipefail
          cd frontend
          npm run lint

      - name: Run frontend unit tests
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
        run: |
          set -euo pipefail
          cd frontend
          npm test

      - name: Build frontend bundle
        run: |
          set -euo pipefail
          cd frontend
          npm run build

      - name: Install Playwright browser
        run: |
          set -euo pipefail
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run mandatory local E2E tests
        env:
          E2E_BASE_URL: http://127.0.0.1:4200
          E2E_USE_LOCAL_SERVERS: 'true'
        run: |
          set -euo pipefail
          cd frontend
          npm run test:e2e

  cleanup-feature:
    if: github.event_name == 'delete' || (github.event_name == 'pull_request' && github.event.action == 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute cleanup variables
        id: vars
        env:
          DELETE_BRANCH: ${{ github.event.ref }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          APP_SLUG: ${{ vars.APP_SLUG }}
          HETZNER_PUBLIC_IP: ${{ vars.HETZNER_PUBLIC_IP }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          set -euo pipefail
          BRANCH_NAME="$DELETE_BRANCH"
          if [ -n "${PR_BRANCH:-}" ] && [ "$PR_BRANCH" != "null" ]; then
            BRANCH_NAME="$PR_BRANCH"
          fi
          HETZNER_PUBLIC_IP="${HETZNER_PUBLIC_IP:-${{ vars.HETZNER_PUBLIC_IP }}}"
          scripts/deployment_vars.sh cleanup "$BRANCH_NAME" "$HETZNER_PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        if: steps.vars.outputs.skip_cleanup == 'false'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ vars.HETZNER_PUBLIC_IP }}" >> ~/.ssh/known_hosts

      - name: Cleanup feature release and namespace
        if: steps.vars.outputs.skip_cleanup == 'false'
        env:
          HOST: ${{ vars.HETZNER_PUBLIC_IP }}
          USER: ${{ secrets.HETZNER_USER }}
          NAMESPACE: ${{ steps.vars.outputs.namespace }}
          RELEASE_NAME: ${{ steps.vars.outputs.release_name }}
        run: |
          set -euo pipefail
          ssh "$USER@$HOST" "helm uninstall '$RELEASE_NAME' -n '$NAMESPACE' || true; kubectl delete namespace '$NAMESPACE' --ignore-not-found=true"
