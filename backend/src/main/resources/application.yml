server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/tts-lab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    repair-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            scope: openid,email,profile

  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        project-id: ${GEMINI_PROJECT_ID:local-project}
        chat:
          options:
            model: ${SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL:gemini-2.5-flash}

chatbot:
  provider: ${CHATBOT_PROVIDER:mock}

auth:
  mode: ${AUTH_MODE:mock}
  environment: ${ENVIRONMENT:feature}
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  mock-user-id: ${MOCK_USER_ID:mock-user-1}
  mock-user-email: ${MOCK_USER_EMAIL:mock.user@example.com}
  mock-user-name: ${MOCK_USER_NAME:Mock User}
  mock-user-roles: ${MOCK_USER_ROLES:USER}

audiobooks:
  storage:
    root: ${AUDIOBOOK_STORAGE_ROOT:./data/audio-storage}
    app-slug: ${APP_SLUG:tts-lab}
    environment: ${ENVIRONMENT:feature}
    branch-slug: ${BRANCH_SLUG:${ENVIRONMENT:feature}}

audiobook-workflow:
  google:
    service-account-json-b64: ${TTS_GOOGLE_SERVICE_ACCOUNT_JSON_B64:}

chat-limit:
  enabled: ${CHAT_LIMIT_ENABLED:true}
  window: ${CHAT_LIMIT_WINDOW:1h}
  max-requests: ${CHAT_LIMIT_MAX_REQUESTS:5}
  id-header: ${CHAT_LIMIT_ID_HEADER:X-User-Id}

request-limits:
  enabled: ${REQUEST_LIMITS_ENABLED:true}
  window: ${REQUEST_LIMITS_WINDOW:12h}
  speech-model-limit: ${REQUEST_LIMITS_SPEECH_MODEL_LIMIT:600}
  text-model-multiplier: ${REQUEST_LIMITS_TEXT_MODEL_MULTIPLIER:1}
  unit: ${REQUEST_LIMITS_UNIT:WORDS}

logging:
  level:
    root: info
    com.example.ttslab: DEBUG

